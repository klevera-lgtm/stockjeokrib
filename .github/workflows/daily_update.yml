name: 📈 Daily Price Update

on:
  schedule:
    # 매일 오전 7시 KST = 22:00 UTC (전날)
    - cron: "0 22 * * *"
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⬢ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        run: |
          pip install yfinance pandas requests

      - name: 🌐 Fetch new WhatOthersBuy tickers
        run: python scripts/fetch_others_tickers.py

      - name: 🔄 Run daily update
        run: |
          cd scripts
          python update_daily.py

      - name: 🏛️ Update constituent prices (S&P500·NDX100·Dow30)
        run: python scripts/update_constituents.py

      - name: 📊 Compute market signals (VIX·낙폭·내부지표·섹터)
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/data/signals" node scripts/computeVixSignal.mjs
          OUT_DIR="$GITHUB_WORKSPACE/data/signals" node scripts/computeDrawdown.mjs
          OUT_DIR="$GITHUB_WORKSPACE/data/signals" node scripts/computeMarketInternals.mjs
          OUT_DIR="$GITHUB_WORKSPACE/data/signals" node scripts/computeSectorHeatmap.mjs
          OUT_DIR="$GITHUB_WORKSPACE/data/signals" node scripts/computeDailyMovers.mjs
          OUT_DIR="$GITHUB_WORKSPACE/data/signals" node scripts/computeRateFxSpread.mjs

      - name: 💾 Commit & Push updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 충돌 방지: 최신 origin 위에 새로 계산한 데이터를 그대로 얹음(rebase 충돌 원천 차단)
          git fetch origin main
          git reset --soft origin/main
          git add data/
          git diff --staged --quiet || git commit -m "📈 Daily update: $(date +'%Y-%m-%d')"
          git push
